<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning App</title>

<style>
body {
  font-family: -apple-system, Arial;
  text-align: center;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 420px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin-top: 20px;
  color: black;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

button {
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 18px;
  width: 85%;
  margin-top: 12px;
}

input {
  padding: 12px;
  font-size: 18px;
  width: 85%;
  border-radius: 10px;
  border: 1px solid #ccc;
}

.progress {
  width: 100%;
  background: #ddd;
  border-radius: 10px;
  margin-top: 10px;
}

.progress-bar {
  height: 10px;
  width: 0%;
  background: green;
  border-radius: 10px;
}

.hidden { display: none; }

.correct { color: green; }
.incorrect { color: red; }

.badge {
  background: gold;
  padding: 8px;
  border-radius: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1 id="title">Learning</h1>

<div id="intro" class="card">
<p>Ready to start?</p>
<button id="startBtn">▶ Start Lesson</button>
</div>

<div id="lessonBox" class="card hidden">
<h2 id="question"></h2>

<div class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>

<p id="timer">Time: 0s</p>

<input id="answer" placeholder="Type answer">
<br>

<button id="submitBtn">Submit</button>
<p id="feedback"></p>
</div>

<div id="resultBox" class="card hidden">
<h2>Session Complete 🎉</h2>
<p id="result"></p>
<p id="level"></p>
<div id="badge"></div>

<button id="restartBtn">New Session</button>
</div>

</div>

<script>

// VARIABLES
let step = 0;
let correct = 0;
let answerVal = 0;
let time = 0;
let timerInterval;

let child = new URLSearchParams(window.location.search).get("child");

// THEME
if(child === "boy"){
  document.body.style.background = "#0b3d91";
  document.body.style.color = "white";
  document.getElementById("title").innerText = "Learning System";
}

if(child === "girl"){
  document.body.style.background = "#ff69b4";
  document.body.style.color = "white";
  document.getElementById("title").innerText = "My Learning";
}

// START BUTTON
document.getElementById("startBtn").addEventListener("click", function(){

  let prompt =
"PARENT CODE: 4321\n" +
"CHILD: " + (child === "boy" ? "Boy 9" : "Girl 7") + "\n" +
"SESSION LENGTH: " + (child === "boy" ? "25" : "15") + " minutes\n\n" +
"Start session";

  let encoded = encodeURIComponent(prompt);

  // ✅ Use reliable Claude URL
  window.open("https://claude.ai/", "_blank");

  // START LOCAL SESSION UI
  document.getElementById("intro").classList.add("hidden");
  document.getElementById("lessonBox").classList.remove("hidden");

  step = 0;
  correct = 0;
  time = 0;

  startTimer();
  nextQuestion();
});

// TIMER
function startTimer(){
  timerInterval = setInterval(()=>{
    time++;
    document.getElementById("timer").innerText = "Time: " + time + "s";
  }, 1000);
}

// QUESTIONS
function nextQuestion(){
  step++;

  document.getElementById("progressBar").style.width = (step * 20) + "%";

  if(step > 5){
    endSession();
    return;
  }

  let a = Math.floor(Math.random()*10);
  let b = Math.floor(Math.random()*10);

  answerVal = a + b;

  document.getElementById("question").innerText =
    "Q" + step + ": " + a + " + " + b;

  document.getElementById("answer").value = "";
  document.getElementById("feedback").innerText = "";
}

// ANSWER SUBMIT
document.getElementById("submitBtn").addEventListener("click", function(){

  let ans = parseInt(document.getElementById("answer").value);

  if(ans === answerVal){
    correct++;
    document.getElementById("feedback").innerHTML =
      "<span class='correct'>✅ Correct</span>";
  } else {
    document.getElementById("feedback").innerHTML =
      "<span class='incorrect'>❌ Incorrect</span>";
  }

  setTimeout(nextQuestion, 800);

});

// END SESSION
function endSession(){
  clearInterval(timerInterval);

  document.getElementById("lessonBox").classList.add("hidden");
  document.getElementById("resultBox").classList.remove("hidden");

  let accuracy = (correct / 5) * 100;

  let level = "Beginner";
  if(accuracy >= 90) level = "Elite 🏆";
  else if(accuracy >= 80) level = "Strong 💪";
  else if(accuracy >= 60) level = "Improving 📈";

  document.getElementById("result").innerText =
    "Score: " + correct + "/5 | Time: " + time + "s";

  document.getElementById("level").innerText =
    "Level: " + level;

  let badge = "";
  if(time < 30 && accuracy >= 80) badge = "⚡ Fast Thinker";
  else if(accuracy >= 80) badge = "🎯 Accurate";
  else badge = "💪 Keep Improving";

  document.getElementById("badge").innerHTML =
    "<div class='badge'>" + badge + "</div>";
}

// RESTART
document.getElementById("restartBtn").addEventListener("click", function(){
  document.getElementById("resultBox").classList.add("hidden");
  document.getElementById("intro").classList.remove("hidden");
});

</script>

</body>
</html>
