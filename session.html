<!DOCTYPE html>
<html>
<head>
<title>Session</title>
<style>
body { text-align:center; font-family: Arial; }
button { padding: 15px; font-size: 18px; margin-top: 20px; }
</style>
</head>

<body>

<h2>Learning Session</h2>

<p id="child"></p>

<p>Tap below to begin your lesson</p>

<button onclick="startLesson()">Start Lesson</button>

<script>
function startLesson(){

  let child = new URLSearchParams(window.location.search).get("child");

  let prompt = encodeURIComponent(`
PARENT CODE: 4321
CHILD: ${child === "boy" ? "Boy 9" : "Girl 7"}
SESSION LENGTH: ${child === "boy" ? "25" : "15"} minutes

Start session
  `);

  window.open("https://claude.ai/new?prompt=" + prompt, "_blank");
}
</script>

</body>
</html>
