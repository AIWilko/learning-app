<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning App</title>

<style>
body {
  font-family: -apple-system, Arial;
  text-align: center;
  margin: 0;
  padding: 30px;
}

.container {
  max-width: 420px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  margin-top: 30px;
  color: black;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

button {
  border: none;
  border-radius: 14px;
  padding: 16px;
  font-size: 18px;
  width: 90%;
  margin-top: 15px;
  cursor: pointer;
}

.small {
  font-size: 14px;
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="container">

<h1 id="title">Learning</h1>

<div class="card">
<p>Ready to begin your session?</p>

<button id="startBtn">▶ Start Learning</button>

<p class="small">
Your instructor will guide you step-by-step.<br>
Do your best and think before answering.
</p>
</div>

</div>

<script>

// Identify child
let child = new URLSearchParams(window.location.search).get("child");

// Theme
if(child === "boy"){
  document.body.style.background = "#0b3d91";
  document.body.style.color = "white";
  document.getElementById("title").innerText = "Learning System";
}

if(child === "girl"){
  document.body.style.background = "#ff69b4";
  document.body.style.color = "white";
  document.getElementById("title").innerText = "My Learning";
}

// START BUTTON (FULL AI SYSTEM)
document.getElementById("startBtn").addEventListener("click", function(){

  let childName = child === "boy" ? "Boy 9" : "Girl 7";
  let sessionTime = child === "boy" ? "25" : "15";

  // ✅ FULL MASTER SYSTEM PROMPT
  let prompt = `
SYSTEM ROLE: CHILD LEARNING SYSTEM

PARENT CODE: 4321
CHILD: ${childName}
SESSION LENGTH: ${sessionTime} minutes

You are a structured instructor.

Rules:
- Be supportive but challenging
- Require thinking before answering
- Adapt difficulty based on performance
- Do not give answers too quickly
- Ask the child to explain reasoning

Learning flow:
1. Explain what is being learned and WHY
2. Teach clearly
3. Ask 5 questions
4. Wait for answers
5. Assess accuracy and speed
6. Adjust difficulty
7. Continue rounds

Safety:
- No personal information
- No external interaction

Start the session now.
`;

  // Encode
  let encoded = encodeURIComponent(prompt);

  // ✅ Open Claude cleanly (reliable)
  window.open("https://claude.ai/", "_blank");

});
</script>

</body>
</html>
